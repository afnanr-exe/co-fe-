name: vocabapp
description: "co:fee vocab app by afnan rahman"
publish_to: 'none'

version: 1.0.4+4

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  http: ^1.2.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  home_widget: ^0.7.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo.png
  min_sdk_android: 21
  background_color: "#0A0A0A"
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: assets/images/logo.png

flutter:
  uses-material-design: true

  assets:
    - assets/words.json
    - assets/images/logo.png